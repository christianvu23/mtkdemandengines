name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          # Node >=22: test runner tự expand glob "tests/**/*.test.js" (Node 20 nhận glob như chuỗi thường → CI hỏng).
          node-version: '22'

      # Cổng chặn: không deploy nếu logic chấm điểm/dedup bị hỏng.
      # Bài học từ CMCTS — một lần redesign làm hỏng tab "Đã lưu" mà không ai bắt được.
      - name: Cai dependency
        run: npm ci || npm install

      - name: Chay test truoc khi deploy
        run: npm test

      - name: Deploy len Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
