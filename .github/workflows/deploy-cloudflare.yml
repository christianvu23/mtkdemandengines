name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cổng chặn: không deploy nếu logic chấm điểm/dedup bị hỏng.
      # Bài học từ CMCTS — một lần redesign làm hỏng tab "Đã lưu" mà không ai bắt được.
      - name: Chay test truoc khi deploy
        run: npm test

      - name: Deploy len Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
