<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demand Engine — Xem Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #F8FAFC; --surface: #FFFFFF;
    --ink-1: #0F172A; --ink-2: #475569; --ink-muted: #94A3B8;
    --border: #E2E8F0; --border-strong: #CBD5E1;
    --accent: #2563EB; --accent-ink: #FFFFFF;
    --tier-a: #1E40AF; --tier-a-ink: #FFFFFF;
    --tier-b: #2563EB; --tier-b-ink: #FFFFFF;
    --tier-c: #60A5FA; --tier-c-ink: #0F172A;
    --tier-d: #DBEAFE; --tier-d-ink: #1E3A8A;
    --good: #16A34A; --warning: #D97706;
    --font-head: "Outfit", system-ui, sans-serif;
    --font-body: "Work Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink-1);
    font: 15px/1.55 var(--font-body);
    padding: 24px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font: 600 24px var(--font-head); }
  .badge {
    display: inline-flex; align-items: center;
    padding: 4px 10px; border-radius: 6px;
    font: 500 12px var(--font-head);
    background: var(--accent); color: var(--accent-ink);
  }
  .stats {
    display: flex; gap: 12px; margin-bottom: 20px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    flex: 1;
  }
  .stat-label { font-size: 12px; color: var(--ink-muted); }
  .stat-value { font: 600 24px var(--font-head); margin-top: 4px; }
  .filters {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filters select, .filters button {
    padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface);
    font: 14px var(--font-body); cursor: pointer;
  }
  .filters button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .leads { display: flex; flex-direction: column; gap: 12px; }
  .lead {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .lead:hover { border-color: var(--accent); }
  .tier {
    width: 48px; height: 48px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 700 18px var(--font-head); flex-shrink: 0;
  }
  .tier small { font-size: 11px; font-weight: 500; opacity: 0.8; }
  .tier-A { background: var(--tier-a); color: var(--tier-a-ink); }
  .tier-B { background: var(--tier-b); color: var(--tier-b-ink); }
  .tier-C { background: var(--tier-c); color: var(--tier-c-ink); }
  .tier-D { background: var(--tier-d); color: var(--tier-d-ink); }
  .lead-content { flex: 1; min-width: 0; }
  .lead-title { font: 600 16px var(--font-head); margin-bottom: 4px; }
  .lead-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
  .lead-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 12px; background: #F1F5F9; color: var(--ink-2);
  }
  .tag-source { background: #EFF6FF; color: var(--accent); }
  .tag-contact { background: #F0FDF4; color: var(--good); }
  .tag-warning { background: #FFFBEB; color: var(--warning); }
  .lead-url { font-size: 12px; color: var(--ink-muted); margin-top: 8px; }
  .lead-url a { color: var(--accent); text-decoration: none; }
  .lead-url a:hover { text-decoration: underline; }
  .empty {
    text-align: center; padding: 48px;
    color: var(--ink-muted); font-size: 14px;
  }
  .loading { text-align: center; padding: 48px; color: var(--ink-muted); }

  /* ── Crawl Panel ─────────────────────────────────────────── */
  .crawl-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .crawl-panel h2 {
    font: 600 16px var(--font-head); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .crawl-controls {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-bottom: 12px;
  }
  .crawl-controls select {
    padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface);
    font: 14px var(--font-body); cursor: pointer;
    min-width: 200px;
  }
  .btn-crawl {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border: none; border-radius: 8px;
    font: 600 14px var(--font-head); cursor: pointer;
    transition: all 0.2s;
  }
  .btn-crawl-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-crawl-primary:hover { background: #1d4ed8; }
  .btn-crawl-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-crawl-secondary { background: #F1F5F9; color: var(--ink-2); border: 1px solid var(--border); }
  .btn-crawl-secondary:hover { background: #E2E8F0; }
  .crawl-status {
    padding: 12px 16px; border-radius: 8px; font-size: 13px;
    display: none; margin-top: 8px;
  }
  .crawl-status.show { display: block; }
  .crawl-status.running { background: #EFF6FF; color: var(--accent); border: 1px solid #BFDBFE; }
  .crawl-status.success { background: #F0FDF4; color: var(--good); border: 1px solid #BBF7D0; }
  .crawl-status.error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
  .crawl-result {
    margin-top: 12px; padding: 12px 16px;
    background: #F8FAFC; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; display: none;
  }
  .crawl-result.show { display: block; }
  .crawl-result-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px; margin-top: 8px;
  }
  .crawl-result-item {
    padding: 8px; background: var(--surface); border-radius: 6px;
    text-align: center;
  }
  .crawl-result-item .num { font: 700 20px var(--font-head); color: var(--accent); }
  .crawl-result-item .label { font-size: 11px; color: var(--ink-muted); }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #BFDBFE; border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .source-groups { margin-top: 8px; }
  .source-group-label {
    font: 500 11px var(--font-head); color: var(--ink-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 8px 0 4px;
  }
  .source-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .source-chip {
    padding: 4px 10px; border-radius: 6px; font-size: 12px;
    background: #F1F5F9; color: var(--ink-2); cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s;
  }
  .source-chip:hover { border-color: var(--accent); color: var(--accent); }
  .source-chip.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  @media (max-width: 640px) {
    .lead { flex-direction: column; }
    .tier { width: 100%; height: auto; padding: 8px; flex-direction: row; gap: 8px; }
    .crawl-controls { flex-direction: column; }
    .crawl-controls select { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Demand Engine</h1>
    <span class="badge" id="modeBadge">Đang tải...</span>
  </header>

  <!-- Crawl Panel -->
  <div class="crawl-panel">
    <h2>🕷️ Thu thập Lead mới</h2>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--ink-muted)">
      <label for="tokenInput">Token:</label>
      <input type="password" id="tokenInput" placeholder="DEMAND_TOKEN" 
        style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;width:200px;background:var(--surface)">
      <button onclick="localStorage.setItem('demand_token', document.getElementById('tokenInput').value); this.textContent='✓ Đã lưu'; setTimeout(()=>this.textContent='Lưu',1500)" 
        style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:var(--surface)">Lưu</button>
    </div>
    <div class="crawl-controls">
      <select id="crawlSource">
        <option value="">Tất cả nguồn (21 nguồn)</option>
      </select>
      <button class="btn-crawl btn-crawl-primary" id="crawlBtn" onclick="runCrawl()">
        ▶ Thu thập ngay
      </button>
      <button class="btn-crawl btn-crawl-secondary" onclick="toggleCrawlPanel()">
        ⚙ Chọn nguồn
      </button>
    </div>

    <div class="source-groups" id="sourceGroups" style="display:none">
      <div class="source-group-label">Nền tảng Freelancer VN</div>
      <div class="source-chips" id="chipsFreelancerVn"></div>
      <div class="source-group-label">Nền tảng Quốc tế (VN)</div>
      <div class="source-chips" id="chipsFreelancerIntl"></div>
      <div class="source-group-label">Trang tuyển dụng</div>
      <div class="source-chips" id="chipsJobboard"></div>
      <div class="source-group-label">Diễn đàn / Cộng đồng</div>
      <div class="source-chips" id="chipsForum"></div>
      <div class="source-group-label">Mạng xã hội</div>
      <div class="source-chips" id="chipsSocial"></div>
    </div>

    <div class="crawl-status" id="crawlStatus"></div>
    <div class="crawl-result" id="crawlResult"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <select id="tierFilter">
      <option value="">Tất cả hạng</option>
      <option value="A">Hạng A</option>
      <option value="B">Hạng B</option>
      <option value="C">Hạng C</option>
      <option value="D">Hạng D</option>
    </select>
    <select id="sourceFilter">
      <option value="">Tất cả nguồn</option>
    </select>
    <button id="refreshBtn">Làm mới</button>
  </div>

  <div class="leads" id="leads">
    <div class="loading">Đang tải leads...</div>
  </div>
</div>

<script>
let allLeads = [];
let filteredLeads = [];

async function loadLeads() {
  document.getElementById('leads').innerHTML = '<div class="loading">Đang tải leads...</div>';
  
  try {
    const res = await fetch('/api/demand/inbox?limit=500');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    const data = await res.json();
    allLeads = data.leads || [];
    
    document.getElementById('modeBadge').textContent = `${allLeads.length} leads`;
    
    // Populate source filter
    const sources = [...new Set(allLeads.map(l => l.source))];
    const sourceSel = document.getElementById('sourceFilter');
    sources.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sourceSel.appendChild(opt);
    });
    
    updateStats();
    filterLeads();
  } catch (err) {
    document.getElementById('leads').innerHTML = `<div class="empty">Lỗi: ${err.message}</div>`;
  }
}

function updateStats() {
  const byTier = { A: 0, B: 0, C: 0, D: 0 };
  allLeads.forEach(l => { if (l.tier) byTier[l.tier]++; });
  
  const avgScore = allLeads.length > 0 
    ? Math.round(allLeads.reduce((sum, l) => sum + (l.score || 0), 0) / allLeads.length)
    : 0;
  
  document.getElementById('stats').innerHTML = `
    <div class="stat">
      <div class="stat-label">Tổng leads</div>
      <div class="stat-value">${allLeads.length}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Điểm trung bình</div>
      <div class="stat-value">${avgScore}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Hạng A</div>
      <div class="stat-value" style="color:var(--tier-a)">${byTier.A}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Hạng B</div>
      <div class="stat-value" style="color:var(--tier-b)">${byTier.B}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Hạng C</div>
      <div class="stat-value" style="color:var(--tier-c)">${byTier.C}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Hạng D</div>
      <div class="stat-value" style="color:var(--tier-d)">${byTier.D}</div>
    </div>
  `;
}

function filterLeads() {
  const tier = document.getElementById('tierFilter').value;
  const source = document.getElementById('sourceFilter').value;
  
  filteredLeads = allLeads.filter(l => {
    if (tier && l.tier !== tier) return false;
    if (source && l.source !== source) return false;
    return true;
  });
  
  renderLeads();
}

function renderLeads() {
  const container = document.getElementById('leads');
  
  if (filteredLeads.length === 0) {
    container.innerHTML = '<div class="empty">Không có leads nào phù hợp bộ lọc.</div>';
    return;
  }
  
  container.innerHTML = filteredLeads.map(l => {
    const contacts = [];
    if (l.contact_zalo) contacts.push(`<span class="tag tag-contact">Zalo: ${esc(l.contact_zalo)}</span>`);
    if (l.contact_phone) contacts.push(`<span class="tag tag-contact">📞 ${esc(l.contact_phone)}</span>`);
    if (l.contact_email) contacts.push(`<span class="tag tag-contact">✉ ${esc(l.contact_email)}</span>`);
    
    const hasContact = contacts.length > 0;
    const warning = l.auto_notes ? `<span class="tag tag-warning">⚠ ${esc(l.auto_notes)}</span>` : '';
    
    return `
      <div class="lead">
        <div class="tier tier-${l.tier}">
          ${l.tier}
          <small>${l.score || 0}</small>
        </div>
        <div class="lead-content">
          <div class="lead-title">${esc(l.title || 'Không có tiêu đề')}</div>
          <div class="lead-meta">
            <span class="tag tag-source">${esc(l.source || 'unknown')}</span>
            <span>📍 ${esc(l.khu_vuc || 'Không rõ')}</span>
            <span>💼 ${esc(l.hinh_thuc || 'unknown')}</span>
            ${l.budget_text ? `<span>💰 ${esc(l.budget_text)}</span>` : ''}
            ${warning}
          </div>
          ${hasContact ? `<div class="lead-meta" style="margin-top:8px">${contacts.join('')}</div>` : ''}
          ${l.source_url ? `<div class="lead-url"><a href="${esc(l.source_url)}" target="_blank" rel="noopener">Xem bài gốc ↗</a></div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Event listeners
document.getElementById('tierFilter').onchange = filterLeads;
document.getElementById('sourceFilter').onchange = filterLeads;
document.getElementById('refreshBtn').onclick = loadLeads;

// Initial load
loadLeads();
loadCrawlSources();

// Load saved token
document.getElementById('tokenInput').value = localStorage.getItem('demand_token') || '';

// ═══════════════════════════════════════════════════════════════
// CRAWL FUNCTIONALITY
// ═══════════════════════════════════════════════════════════════

const CRAWL_SOURCE_MAP = {
  // Freelancer VN
  vlance: { name: 'vLance.vn', cat: 'freelancer_vn' },
  freelancer_vn: { name: 'FreelancerViet.vn', cat: 'freelancer_vn' },
  fastlance: { name: 'Fastlance.vn', cat: 'freelancer_vn' },
  vietgigs: { name: 'VietGigs.vn', cat: 'freelancer_vn' },
  gighit: { name: 'GigHit.vn', cat: 'freelancer_vn' },
  jobboard_vn: { name: 'JobBoard.vn', cat: 'freelancer_vn' },
  jobsgo: { name: 'JobsGo.vn', cat: 'freelancer_vn' },
  // Freelancer Intl
  upwork_vn: { name: 'Upwork Vietnam', cat: 'freelancer_intl' },
  freelancer_com_vn: { name: 'Freelancer.com VN', cat: 'freelancer_intl' },
  truelancer_vn: { name: 'Truelancer VN', cat: 'freelancer_intl' },
  behance_vn: { name: 'Behance Vietnam', cat: 'freelancer_intl' },
  contra_vn: { name: 'Contra.com VN', cat: 'freelancer_intl' },
  peopleperhour: { name: 'PeoplePerHour', cat: 'freelancer_intl' },
  // Job boards
  careerviet: { name: 'CareerViet.vn', cat: 'jobboard' },
  topcv: { name: 'TopCV.vn', cat: 'jobboard' },
  job123: { name: '123Job.vn', cat: 'jobboard' },
  // Forums
  bhw: { name: 'BlackHatWorld', cat: 'forum' },
  warriorforum: { name: 'WarriorForum', cat: 'forum' },
  voz_marketing: { name: 'VOZ Marketing', cat: 'forum' },
  brands_vietnam: { name: 'Brands Vietnam', cat: 'forum' },
  vn_marketing: { name: 'VietnamMarketing', cat: 'forum' },
  // Social
  tiktok_business: { name: 'TikTok Business', cat: 'social' },
  fb_groups: { name: 'Facebook Groups', cat: 'social' },
};

let selectedSources = new Set();

function loadCrawlSources() {
  // Populate dropdown
  const sel = document.getElementById('crawlSource');
  const groups = {};
  for (const [code, info] of Object.entries(CRAWL_SOURCE_MAP)) {
    if (!groups[info.cat]) groups[info.cat] = [];
    groups[info.cat].push({ code, name: info.name });
  }
  for (const [cat, items] of Object.entries(groups)) {
    const optgroup = document.createElement('optgroup');
    optgroup.label = cat.replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase());
    for (const item of items) {
      const opt = document.createElement('option');
      opt.value = item.code;
      opt.textContent = item.name;
      optgroup.appendChild(opt);
    }
    sel.appendChild(optgroup);
  }

  // Populate chips
  const chipContainers = {
    freelancer_vn: 'chipsFreelancerVn',
    freelancer_intl: 'chipsFreelancerIntl',
    jobboard: 'chipsJobboard',
    forum: 'chipsForum',
    social: 'chipsSocial',
  };
  for (const [cat, containerId] of Object.entries(chipContainers)) {
    const container = document.getElementById(containerId);
    if (!container) continue;
    const items = Object.entries(CRAWL_SOURCE_MAP).filter(([_, v]) => v.cat === cat);
    container.innerHTML = items.map(([code, info]) =>
      `<span class="source-chip" data-code="${code}" onclick="toggleSourceChip(this, '${code}')">${info.name}</span>`
    ).join('');
  }
}

function toggleSourceChip(el, code) {
  if (selectedSources.has(code)) {
    selectedSources.delete(code);
    el.classList.remove('selected');
  } else {
    selectedSources.add(code);
    el.classList.add('selected');
  }
}

function toggleCrawlPanel() {
  const panel = document.getElementById('sourceGroups');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

function showCrawlStatus(msg, type) {
  const el = document.getElementById('crawlStatus');
  el.className = `crawl-status show ${type}`;
  el.innerHTML = msg;
}

function hideCrawlStatus() {
  document.getElementById('crawlStatus').className = 'crawl-status';
}

function showCrawlResult(data) {
  const el = document.getElementById('crawlResult');
  el.className = 'crawl-result show';

  const sources = data.summary?.sources || [];
  const sourceRows = sources.map(s =>
    `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">
      <span>${esc(s.name)}</span>
      <span><strong style="color:var(--good)">${s.leads}</strong> leads / ${s.items} items${s.error ? ` <span style="color:#DC2626">(${esc(s.error)})</span>` : ''}</span>
    </div>`
  ).join('');

  el.innerHTML = `
    <div style="font-weight:600;margin-bottom:8px">Kết quả thu thập</div>
    <div class="crawl-result-grid">
      <div class="crawl-result-item">
        <div class="num">${data.summary?.totalItems || 0}</div>
        <div class="label">Tổng items</div>
      </div>
      <div class="crawl-result-item">
        <div class="num" style="color:var(--good)">${data.summary?.totalLeads || 0}</div>
        <div class="label">Job Leads</div>
      </div>
      <div class="crawl-result-item">
        <div class="num">${data.duration || '—'}</div>
        <div class="label">Thời gian</div>
      </div>
    </div>
    <div style="margin-top:12px">${sourceRows}</div>
  `;
}

async function runCrawl() {
  const btn = document.getElementById('crawlBtn');
  const sourceSelect = document.getElementById('crawlSource');
  const source = sourceSelect.value;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Đang thu thập...';
  hideCrawlStatus();
  document.getElementById('crawlResult').className = 'crawl-result';

  showCrawlStatus(
    `<span class="spinner"></span> Đang thu thập lead từ ${source ? CRAWL_SOURCE_MAP[source]?.name || source : 'tất cả 21 nguồn'}...`,
    'running'
  );

  try {
    const token = localStorage.getItem('demand_token') || '';
    const body = {};
    if (source) body.source = source;

    const res = await fetch('/api/crawl/run', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Demand-Token': token,
      },
      body: JSON.stringify(body),
    });

    const data = await res.json();

    if (!res.ok) {
      showCrawlStatus(`Lỗi: ${esc(data.error || data.loi || 'Không xác định')}`, 'error');
    } else {
      showCrawlStatus(
        `✓ Thu thập hoàn thành! ${data.summary?.totalLeads || 0} job leads từ ${data.summary?.totalItems || 0} items`,
        'success'
      );
      showCrawlResult(data);
      // Reload leads after crawl
      setTimeout(() => loadLeads(), 1000);
    }
  } catch (err) {
    showCrawlStatus(`Lỗi kết nối: ${esc(err.message)}`, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ Thu thập ngay';
  }
}
</script>
</body>
</html>
