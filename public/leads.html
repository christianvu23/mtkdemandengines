<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demand Engine — Xem Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #F8FAFC; --surface: #FFFFFF;
    --ink-1: #0F172A; --ink-2: #475569; --ink-muted: #94A3B8;
    --border: #E2E8F0; --border-strong: #CBD5E1;
    --accent: #2563EB; --accent-ink: #FFFFFF;
    --tier-a: #1E40AF; --tier-a-ink: #FFFFFF;
    --tier-b: #2563EB; --tier-b-ink: #FFFFFF;
    --tier-c: #60A5FA; --tier-c-ink: #0F172A;
    --tier-d: #DBEAFE; --tier-d-ink: #1E3A8A;
    --good: #16A34A; --warning: #D97706;
    --font-head: "Outfit", system-ui, sans-serif;
    --font-body: "Work Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink-1);
    font: 15px/1.55 var(--font-body);
    padding: 24px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font: 600 24px var(--font-head); }
  .badge {
    display: inline-flex; align-items: center;
    padding: 4px 10px; border-radius: 6px;
    font: 500 12px var(--font-head);
    background: var(--accent); color: var(--accent-ink);
  }
  .stats {
    display: flex; gap: 12px; margin-bottom: 20px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    flex: 1;
  }
  .stat-label { font-size: 12px; color: var(--ink-muted); }
  .stat-value { font: 600 24px var(--font-head); margin-top: 4px; }
  .filters {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filters select, .filters button {
    padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface);
    font: 14px var(--font-body); cursor: pointer;
  }
  .filters button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .leads { display: flex; flex-direction: column; gap: 12px; }
  .lead {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .lead:hover { border-color: var(--accent); }
  .tier {
    width: 48px; height: 48px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 700 18px var(--font-head); flex-shrink: 0;
  }
  .tier small { font-size: 11px; font-weight: 500; opacity: 0.8; }
  .tier-A { background: var(--tier-a); color: var(--tier-a-ink); }
  .tier-B { background: var(--tier-b); color: var(--tier-b-ink); }
  .tier-C { background: var(--tier-c); color: var(--tier-c-ink); }
  .tier-D { background: var(--tier-d); color: var(--tier-d-ink); }
  .lead-content { flex: 1; min-width: 0; }
  .lead-title { font: 600 16px var(--font-head); margin-bottom: 4px; }
  .lead-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
  .lead-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 12px; background: #F1F5F9; color: var(--ink-2);
  }
  .tag-source { background: #EFF6FF; color: var(--accent); }
  .tag-contact { background: #F0FDF4; color: var(--good); }
  .tag-warning { background: #FFFBEB; color: var(--warning); }
  .lead-url { font-size: 12px; color: var(--ink-muted); margin-top: 8px; }
  .lead-url a { color: var(--accent); text-decoration: none; }
  .lead-url a:hover { text-decoration: underline; }
  .empty {
    text-align: center; padding: 48px;
    color: var(--ink-muted); font-size: 14px;
  }
  .loading { text-align: center; padding: 48px; color: var(--ink-muted); }
  @media (max-width: 640px) {
    .lead { flex-direction: column; }
    .tier { width: 100%; height: auto; padding: 8px; flex-direction: row; gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Demand Engine</h1>
    <span class="badge" id="modeBadge">Đang tải...</span>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <select id="tierFilter">
      <option value="">Tất cả hạng</option>
      <option value="A">Hạng A</option>
      <option value="B">Hạng B</option>
      <option value="C">Hạng C</option>
      <option value="D">Hạng D</option>
    </select>
    <select id="sourceFilter">
      <option value="">Tất cả nguồn</option>
    </select>
    <button id="refreshBtn">Làm mới</button>
  </div>

  <div class="leads" id="leads">
    <div class="loading">Đang tải leads...</div>
  </div>
</div>

<script>
let allLeads = [];
let filteredLeads = [];

async function loadLeads() {
  document.getElementById('leads').innerHTML = '<div class="loading">Đang tải leads...</div>';
  
  try {
    const res = await fetch('/api/demand/inbox?limit=500');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    const data = await res.json();
    allLeads = data.leads || [];
    
    document.getElementById('modeBadge').textContent = `${allLeads.length} leads`;
    
    // Populate source filter
    const sources = [...new Set(allLeads.map(l => l.source))];
    const sourceSel = document.getElementById('sourceFilter');
    sources.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sourceSel.appendChild(opt);
    });
    
    updateStats();
    filterLeads();
  } catch (err) {
    document.getElementById('leads').innerHTML = `<div class="empty">Lỗi: ${err.message}</div>`;
  }
}

function updateStats() {
  const byTier = { A: 0, B: 0, C: 0, D: 0 };
  allLeads.forEach(l => { if (l.tier) byTier[l.tier]++; });
  
  const avgScore = allLeads.length > 0 
    ? Math.round(allLeads.reduce((sum, l) => sum + (l.score || 0), 0) / allLeads.length)
    : 0;
  
  document.getElementById('stats').innerHTML = `
    <div class="stat">
      <div class="stat-label">Tổng leads</div>
      <div class="stat-value">${allLeads.length}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Điểm trung bình</div>
      <div class="stat-value">${avgScore}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Hạng A</div>
      <div class="stat-value" style="color:var(--tier-a)">${byTier.A}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Hạng B</div>
      <div class="stat-value" style="color:var(--tier-b)">${byTier.B}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Hạng C</div>
      <div class="stat-value" style="color:var(--tier-c)">${byTier.C}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Hạng D</div>
      <div class="stat-value" style="color:var(--tier-d)">${byTier.D}</div>
    </div>
  `;
}

function filterLeads() {
  const tier = document.getElementById('tierFilter').value;
  const source = document.getElementById('sourceFilter').value;
  
  filteredLeads = allLeads.filter(l => {
    if (tier && l.tier !== tier) return false;
    if (source && l.source !== source) return false;
    return true;
  });
  
  renderLeads();
}

function renderLeads() {
  const container = document.getElementById('leads');
  
  if (filteredLeads.length === 0) {
    container.innerHTML = '<div class="empty">Không có leads nào phù hợp bộ lọc.</div>';
    return;
  }
  
  container.innerHTML = filteredLeads.map(l => {
    const contacts = [];
    if (l.contact_zalo) contacts.push(`<span class="tag tag-contact">Zalo: ${esc(l.contact_zalo)}</span>`);
    if (l.contact_phone) contacts.push(`<span class="tag tag-contact">📞 ${esc(l.contact_phone)}</span>`);
    if (l.contact_email) contacts.push(`<span class="tag tag-contact">✉ ${esc(l.contact_email)}</span>`);
    
    const hasContact = contacts.length > 0;
    const warning = l.auto_notes ? `<span class="tag tag-warning">⚠ ${esc(l.auto_notes)}</span>` : '';
    
    return `
      <div class="lead">
        <div class="tier tier-${l.tier}">
          ${l.tier}
          <small>${l.score || 0}</small>
        </div>
        <div class="lead-content">
          <div class="lead-title">${esc(l.title || 'Không có tiêu đề')}</div>
          <div class="lead-meta">
            <span class="tag tag-source">${esc(l.source || 'unknown')}</span>
            <span>📍 ${esc(l.khu_vuc || 'Không rõ')}</span>
            <span>💼 ${esc(l.hinh_thuc || 'unknown')}</span>
            ${l.budget_text ? `<span>💰 ${esc(l.budget_text)}</span>` : ''}
            ${warning}
          </div>
          ${hasContact ? `<div class="lead-meta" style="margin-top:8px">${contacts.join('')}</div>` : ''}
          ${l.source_url ? `<div class="lead-url"><a href="${esc(l.source_url)}" target="_blank" rel="noopener">Xem bài gốc ↗</a></div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Event listeners
document.getElementById('tierFilter').onchange = filterLeads;
document.getElementById('sourceFilter').onchange = filterLeads;
document.getElementById('refreshBtn').onclick = loadLeads;

// Initial load
loadLeads();
</script>
</body>
</html>
