  :root {

    --plane: #f9f9f7;

    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --track: #cde2fb;
    --tier-a: #184f95; --tier-b: #2a78d6; --tier-c: #5598e7; --tier-d: #86b6ef;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --shadow: 0 1px 2px rgba(11,11,11,.05), 0 4px 12px rgba(11,11,11,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --plane: #0d0d0d;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --track: #0d366b;
      --tier-a: #cde2fb; --tier-b: #9ec5f4; --tier-c: #6da7ec; --tier-d: #3987e5;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --plane: #0d0d0d;
    --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --track: #0d366b;
    --tier-a: #cde2fb; --tier-b: #9ec5f4; --tier-c: #6da7ec; --tier-d: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);

  * { box-sizing: border-box; }
  body {

  .sub { color: var(--ink-2); font-size: 13px; margin: 2px 0 20px; }
  .spacer { flex: 1; }
  .badge {

    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--ink-2); background: var(--surface-1);
  }
  .badge.demo { color: #7a4a00; background: #fff4dd; border-color: #f0d9a8; }
  :root[data-theme="dark"] .badge.demo { color: #fab219; background: #2a2410; border-color: #4a3d15; }
  .badge.live { color: #0a5c0a; background: #e6f6e6; border-color: #b6e0b6; }
  :root[data-theme="dark"] .badge.live { color: #0ca30c; background: #10240f; border-color: #1c4a1c; }

  button, select, input {
    font: inherit; color: var(--ink-1); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--baseline); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; }

  /* ---------- KPI (stat tiles) ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 12px; margin-bottom: 18px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .tile .label { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .tile .value { font-size: 30px; font-weight: 650; line-height: 1.1; letter-spacing: -.02em; }
  .tile .note { font-size: 12px; color: var(--ink-muted); margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---------- Bộ lọc: một hàng trên danh sách ---------- */
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px;
    padding: 10px 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  }
  .filters label { font-size: 12px; color: var(--ink-2); margin-right: 2px; }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--ink-2);
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }

  /* ---------- Danh sách lead ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer;
    display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: start;
  }
  .card:hover { border-color: var(--baseline); }
  .tierbox {
    width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 19px; line-height: 1;
  }
  /* Ô hạng: chữ phải đủ tương phản trên NỀN CỦA CHÍNH NÓ, không dùng một màu chữ cho cả 4 bậc.
     Hai bậc nhạt nhất ở chế độ sáng (C, D) phải đổi sang mực tối. */
  .t-C, .t-D { color: #0b0b0b; }
  :root[data-theme="dark"] .tierbox { color: #0b0b0b; }
  .tierbox small { display: block; font-size: 10px; font-weight: 600; opacity: .85; margin-top: 3px; }
  .t-A { background: var(--tier-a); } .t-B { background: var(--tier-b); }
  .t-C { background: var(--tier-c); } .t-D { background: var(--tier-d); }

  .card h3 { margin: 0 0 5px; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); }
  .tag { padding: 2px 7px; border-radius: 6px; background: var(--plane); border: 1px solid var(--border); }
  .right { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 130px; }
  .countdown { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; justify-content: flex-end; }

  /* Meter: fill = accent, track = bậc nhạt hơn cùng ramp; đầu dữ liệu bo 4px, neo vào baseline */
  .meter { width: 100%; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 9px; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }

  /* ---------- Panel chi tiết ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; }
  .backdrop.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100%);
    background: var(--surface-1); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .18s ease; overflow-y: auto; padding: 20px;
  }
  .drawer.open { transform: none; }
  .drawer h2 { font-size: 17px; margin: 0 0 4px; line-height: 1.35; }
  .bd { margin-top: 6px; }
  .bd-row { display: grid; grid-template-columns: 132px 1fr 38px; gap: 10px; align-items: center; margin-bottom: 7px; font-size: 12px; }
  .bd-row .n { color: var(--ink-2); }
  .bd-row .v { text-align: right; color: var(--ink-1); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bd-bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bd-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  /* Dòng phạt: track trung tính để màu cảnh báo không bị nền cùng ramp nuốt mất */
  .bd-bar.neg { background: var(--grid); }
  .bd-bar.neg > i { background: var(--critical); }
  pre.raw {
    white-space: pre-wrap; font: 13px/1.55 system-ui, sans-serif; background: var(--plane);
    border: 1px solid var(--border); border-radius: 8px; padding: 11px; color: var(--ink-2); margin: 0;
  }
  .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-muted); margin: 18px 0 7px; font-weight: 650; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 48px 20px; color: var(--ink-2); }
  .warn {
    background: #fff4dd; border: 1px solid #f0d9a8; color: #6b4200;
    padding: 10px 13px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
  }
  :root[data-theme="dark"] .warn { background: #2a2410; border-color: #4a3d15; color: #e8c87a; }
  a { color: var(--accent); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tbl th, table.tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  table.tbl th { color: var(--ink-muted); font-weight: 600; }
  table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>

// ------------------------------------------------------------------- Tiện ích
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const conHan = (l) => !l.expires_at || new Date(l.expires_at) > new Date();

function conLaiGio(l) {
  if (!l.expires_at) return null;
  return (new Date(l.expires_at) - Date.now()) / 3600e3;
}
/** Trạng thái khẩn: màu LUÔN đi kèm chữ + chấm, không bao giờ chỉ dựa vào màu. */
function mucKhan(l) {
  const h = conLaiGio(l);
  if (h == null) return { mau: 'var(--ink-muted)', chu: 'không rõ hạn' };
  if (h <= 0) return { mau: 'var(--ink-muted)', chu: 'đã hết hạn' };
  if (h <= 2) return { mau: 'var(--critical)', chu: `còn ${Math.max(1, Math.round(h * 60))} phút` };
  if (h <= 6) return { mau: 'var(--warning)', chu: `còn ${h.toFixed(1)} giờ` };
  if (h <= 24) return { mau: 'var(--serious)', chu: `còn ${Math.round(h)} giờ` };
  return { mau: 'var(--good)', chu: `còn ${Math.round(h / 24)} ngày` };
}
const tienVN = (n) => n == null ? null : (n >= 1e6 ? `${(n/1e6).toFixed(n % 1e6 ? 1 : 0)}tr` : `${Math.round(n/1e3)}k`);

function locLeads() {
  return S.leads.filter((l) => {
    if (S.loc.tier.size && !S.loc.tier.has(l.tier)) return false;
    if (S.loc.source && l.source !== S.loc.source) return false;
    if (S.loc.need && !(l.nhu_cau || []).includes(S.loc.need)) return false;
    if (S.loc.freshOnly && !conHan(l)) return false;
    if (S.loc.uncontacted && l.status && l.status !== 'moi') return false;
    return true;
  }).sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
}

// --------------------------------------------------------------------- Render
function veKpi() {
  const con = S.leads.filter(conHan);
  const sapHet = con.filter((l) => { const h = conLaiGio(l); return h != null && h <= 6; });
  const hangA = con.filter((l) => l.tier === 'A');
  const chuaCham = con.filter((l) => !l.status || l.status === 'moi');
  const tiles = [
    { label: 'Lead còn hạn', value: con.length, note: `${S.leads.length} tổng đã thu thập`, mau: null },
    { label: 'Hạng A', value: hangA.length, note: 'điểm ≥ 75 — ưu tiên chạm', mau: 'var(--tier-a)' },
    { label: 'Sắp hết hạn', value: sapHet.length, note: 'còn dưới 6 giờ', mau: 'var(--warning)' },
    { label: 'Chưa liên hệ', value: chuaCham.length, note: 'chờ bạn quyết định', mau: 'var(--accent)' },
  ];
  $('#kpis').innerHTML = tiles.map((t) => `
    <div class="tile">
      <div class="label">${t.label}</div>
      <div class="value">${t.value}</div>
      <div class="note">${t.mau ? `<span class="dot" style="background:${t.mau}"></span>` : ''}${t.note}</div>
    </div>`).join('');
}

function veThe(l) {
  const k = mucKhan(l);
  const nc = (l.nhu_cau || []).map((n) => `<span class="tag">${NHAN_NHU_CAU[n] || n}</span>`).join('');
  const lh = l.contact_zalo ? `Zalo ${l.contact_zalo}` : l.contact_phone ? l.contact_phone
           : l.contact_email ? l.contact_email : l.contact_url ? 'có link' : '⚠ chưa có liên hệ';
  return `
  <article class="card" data-id="${l.id}">
    <div class="tierbox t-${l.tier}">${l.tier}<small>${l.score}</small></div>
    <div>
      <h3>${esc(l.title)}</h3>
      <div class="meta">
        <span class="tag">${NHAN_NGUON[l.source] || l.source}</span>
        ${l.khu_vuc && l.khu_vuc !== 'Không rõ' ? `<span class="tag">${esc(l.khu_vuc)}</span>` : ''}
        ${nc}
        ${l.budget_text ? `<span class="tag">${esc(l.budget_text)}</span>` : ''}
      </div>
      <div class="meter" title="Điểm ${l.score}/100"><i style="width:${Math.max(0, Math.min(100, l.score))}%"></i></div>
    </div>
    <div class="right">
      <div class="countdown" style="color:${k.mau}"><span class="dot" style="background:${k.mau}"></span>${k.chu}</div>
      <div style="font-size:12px;color:var(--ink-2)">${esc(lh)}</div>
      ${l.status ? `<span class="badge">${esc(NHAN_TRANG_THAI[l.status] || l.status)}</span>` : ''}
    </div>
  </article>`;
}

function veDanhSach() {
  const ds = locLeads();
  $('#list').innerHTML = ds.length
    ? ds.map(veThe).join('')
    : `<div class="empty">Không có lead nào khớp bộ lọc.</div>`;
  veBang(ds);
}

/** Bảng dữ liệu — kênh truy cập thay thế, bắt buộc theo yêu cầu accessibility. */
function veBang(ds) {
  $('#tableView').style.display = S.tableView ? 'block' : 'none';
  if (!S.tableView) return;
  $('#tableView').innerHTML = `
    <table class="tbl"><thead><tr>
      <th>Hạng</th><th class="num">Điểm</th><th>Tiêu đề</th><th>Nguồn</th><th>Khu vực</th><th>Còn lại</th><th>Liên hệ</th>
    </tr></thead><tbody>
    ${ds.map((l) => `<tr>
      <td>${l.tier}</td><td class="num">${l.score}</td><td>${esc(l.title)}</td>
      <td>${NHAN_NGUON[l.source] || l.source}</td><td>${esc(l.khu_vuc || '')}</td>
      <td>${mucKhan(l).chu}</td>
      <td>${esc(l.contact_zalo || l.contact_phone || l.contact_email || (l.contact_url ? 'link' : '—'))}</td>
    </tr>`).join('')}
    </tbody></table>`;
}

function moChiTiet(id) {
  const l = S.leads.find((x) => String(x.id) === String(id));
  if (!l) return;
  const bd = l.score_breakdown || {};
  const hang = Object.keys(NHAN_TRUC).filter((k) => k in bd).map((k) => {
    const v = bd[k]; const tran = TRAN_TRUC[k] || 1; const am = v < 0;
    const pct = Math.min(100, Math.abs(v) / tran * 100);
    return `<div class="bd-row">
      <span class="n">${NHAN_TRUC[k]}</span>
      <span class="bd-bar ${am ? 'neg' : ''}"><i style="width:${pct}%"></i></span>
      <span class="v">${v > 0 ? v : v}</span>
    </div>`;
  }).join('');
  const k = mucKhan(l);
  $('#drawer').innerHTML = `
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div class="tierbox t-${l.tier}">${l.tier}<small>${l.score}</small></div>
      <div style="flex:1"><h2>${esc(l.title)}</h2>
        <div class="meta"><span class="tag">${NHAN_NGUON[l.source] || l.source}</span>
        <span style="color:${k.mau}">● ${k.chu}</span></div>
      </div>
      <button class="ghost" id="closeDrawer">✕</button>
    </div>

    <div class="sec">Phân rã điểm (thang 100)</div>
    <div class="bd">${hang || '<span style="font-size:12px;color:var(--ink-muted)">Chưa có phân rã</span>'}</div>

    <div class="sec">Liên hệ</div>
    <div class="meta">
      ${l.contact_zalo ? `<span class="tag">Zalo ${esc(l.contact_zalo)}</span>` : ''}
      ${l.contact_phone ? `<span class="tag">${esc(l.contact_phone)}</span>` : ''}
      ${l.contact_email ? `<span class="tag">${esc(l.contact_email)}</span>` : ''}
      ${l.contact_url ? `<a class="tag" href="${esc(l.contact_url)}" target="_blank" rel="noopener">Mở link</a>` : ''}
      ${!(l.contact_zalo||l.contact_phone||l.contact_email||l.contact_url) ? '<span class="tag">⚠ Chưa có đường liên hệ — cần làm giàu</span>' : ''}
    </div>

    <div class="sec">Nội dung gốc</div>
    <pre class="raw">${esc(l.raw_text)}</pre>
    ${l.source_url ? `<p style="font-size:12px;margin:8px 0 0"><a href="${esc(l.source_url)}" target="_blank" rel="noopener">Xem bài gốc ↗</a></p>` : ''}

    <div class="sec">Bạn quyết định</div>
    <div class="actions">
      <button data-st="quan_tam">Quan tâm</button>
      <button data-st="da_lien_he">Đã liên hệ</button>
      <button data-st="bo">Bỏ qua</button>
    </div>
    <p style="font-size:12px;color:var(--ink-muted);margin-top:14px">
      Máy chỉ đề xuất và xếp hạng. Mọi thay đổi trạng thái đều do bạn bấm, và được ghi vào nhật ký kiểm toán.
    </p>`;
  $('#drawer').classList.add('open');
  $('#backdrop').classList.add('open');
  $('#closeDrawer').onclick = dongChiTiet;
  $('#drawer').querySelectorAll('[data-st]').forEach((b) => {
    b.onclick = () => datTrangThai(l, b.dataset.st);
  });
}
function dongChiTiet() {
  $('#drawer').classList.remove('open');
  $('#backdrop').classList.remove('open');
}

async function datTrangThai(l, st) {
  l.status = st;
  if (S.mode === 'live' && S.sb) {
    const { error } = await S.sb.from('demand_leads').update({ status: st, reviewed_at: new Date().toISOString() }).eq('id', l.id);
    if (error) return baoLoi(`Không cập nhật được: ${error.message}`);
  }
  veKpi(); veDanhSach(); dongChiTiet();
}

function baoLoi(msg) {
  $('#warnBox').style.display = 'block';
  $('#warnBox').textContent = msg;
}

// ------------------------------------------------------------- Chế độ LIVE
async function ketNoi() {
  baoLoi('Đang tải thư viện Supabase…');
  let createClient;
  try {
    ({ createClient } = await import(CAU_HINH.cdn));
  } catch (e) {
    return baoLoi('Không tải được thư viện Supabase từ CDN (có thể do môi trường xem chặn mạng ngoài). Chế độ Demo vẫn dùng bình thường để review giao diện.');
  }
  S.sb = createClient(CAU_HINH.supabaseUrl, CAU_HINH.supabaseKey);
  const { data: { session } } = await S.sb.auth.getSession();
  if (!session) {
    const { error } = await S.sb.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: location.href } });
    if (error) return baoLoi(`Đăng nhập thất bại: ${error.message}`);
    return;
  }
  S.user = session.user;
  await taiLead();
}

async function taiLead() {
  const { data, error } = await S.sb.from('demand_leads').select('*').order('score', { ascending: false }).limit(500);
  if (error) return baoLoi(`Không đọc được dữ liệu: ${error.message}. Kiểm tra vai trò trong app_users đã được phê duyệt chưa.`);
  S.mode = 'live';
  S.leads = data || [];
  $('#modeBadge').textContent = 'Live';
  $('#modeBadge').className = 'badge live';
  $('#subline').textContent = `Đang nối Supabase — ${S.leads.length} lead. Tài khoản: ${S.user?.email || ''}`;
  $('#warnBox').style.display = 'none';
  if (S.leads.length === 0) baoLoi('Kết nối thành công nhưng bảng demand_leads đang trống — chưa có scraper nào chạy.');
  dungBoLoc(); veKpi(); veDanhSach();
}

async function napLeadMoi() {
  if (S.mode !== 'live' || !S.sb) return baoLoi('Cần "Kết nối dữ liệu thật" trước khi nạp lead.');
  const { data, error } = await S.sb.rpc('merge_demand_inbox');
  if (error) return baoLoi(`Nạp thất bại: ${error.message}`);
  const r = Array.isArray(data) ? data[0] : data;
  baoLoi(`Nạp xong — thêm mới ${r.them_moi}, bị chặn ${r.bi_chan}, đã có ${r.da_co}, trùng nội dung ${r.trung_noi_dung}, hết hạn ${r.het_han}.`);
  await taiLead();
}

// ------------------------------------------------------------------- Bộ lọc
function dungBoLoc() {
  const nguon = [...new Set(S.leads.map((l) => l.source))];
  $('#srcSel').innerHTML = '<option value="">Tất cả</option>' +
    nguon.map((s) => `<option value="${s}">${NHAN_NGUON[s] || s}</option>`).join('');
  const needs = [...new Set(S.leads.flatMap((l) => l.nhu_cau || []))];
  $('#needSel').innerHTML = '<option value="">Tất cả</option>' +
    needs.map((n) => `<option value="${n}">${NHAN_NHU_CAU[n] || n}</option>`).join('');
}

// ---------------------------------------------------------------- Sự kiện
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip[data-f="tier"]');
  if (chip) {
    const v = chip.dataset.v; const on = chip.getAttribute('aria-pressed') === 'true';
    chip.setAttribute('aria-pressed', String(!on));
    on ? S.loc.tier.delete(v) : S.loc.tier.add(v);
    return veDanhSach();
  }
  const card = e.target.closest('.card');
  if (card) return moChiTiet(card.dataset.id);
});
$('#backdrop').onclick = dongChiTiet;
$('#srcSel').onchange = (e) => { S.loc.source = e.target.value; veDanhSach(); };
$('#needSel').onchange = (e) => { S.loc.need = e.target.value; veDanhSach(); };
$('#freshOnly').onclick = (e) => {
  S.loc.freshOnly = !S.loc.freshOnly;
  e.currentTarget.setAttribute('aria-pressed', String(S.loc.freshOnly));
  veKpi(); veDanhSach();
};
$('#uncontacted').onclick = (e) => {
  S.loc.uncontacted = !S.loc.uncontacted;
  e.currentTarget.setAttribute('aria-pressed', String(S.loc.uncontacted));
  veDanhSach();
};
$('#themeBtn').onclick = () => {
  document.documentElement.dataset.theme =
    document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
};
$('#tableBtn').onclick = () => { S.tableView = !S.tableView; veDanhSach(); };
$('#connectBtn').onclick = ketNoi;
$('#mergeBtn').onclick = napLeadMoi;

// Đồng hồ đếm ngược sống — lead là tài sản có hạn dùng, giao diện phải thể hiện điều đó
setInterval(() => { if (!$('#drawer').classList.contains('open')) { veKpi(); veDanhSach(); } }, 60000);

dungBoLoc(); veKpi(); veDanhSach();
</script>
</body>
</html>
