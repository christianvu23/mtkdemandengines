<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Design system: design-system/demand-engine/MASTER.md + pages/app.md
     Electric blue · flat · minimal. Không shadow, không gradient — phân cấp bằng
     border, khoảng trắng và typography. */
  :root {
    color-scheme: light;
    --bg: #F8FAFC; --surface: #FFFFFF;
    --ink-1: #0F172A; --ink-2: #475569; --ink-muted: #94A3B8;
    --border: #E2E8F0; --border-strong: #CBD5E1;
    --accent: #2563EB; --accent-ink: #FFFFFF; --accent-soft: #EFF6FF;
    --track: #E2E8F0;
    --tier-a: #1E40AF; --tier-a-ink: #FFFFFF;
    --tier-b: #2563EB; --tier-b-ink: #FFFFFF;
    --tier-c: #60A5FA; --tier-c-ink: #0F172A;
    --tier-d: #DBEAFE; --tier-d-ink: #1E3A8A;
    --good: #16A34A; --warning: #D97706; --serious: #EA580C; --critical: #DC2626;
    --warn-bg: #FFFBEB; --warn-border: #FDE68A; --warn-ink: #92400E;
    --font-head: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F172A; --surface: #1E293B;
    --ink-1: #F1F5F9; --ink-2: #94A3B8; --ink-muted: #64748B;
    --border: rgba(148,163,184,.18); --border-strong: rgba(148,163,184,.42);
    --accent: #3B82F6; --accent-ink: #FFFFFF; --accent-soft: #172554;
    --track: #334155;
    --tier-a: #DBEAFE; --tier-a-ink: #1E3A8A;
    --tier-b: #60A5FA; --tier-b-ink: #0F172A;
    --tier-c: #2563EB; --tier-c-ink: #FFFFFF;
    --tier-d: #1E3A8A; --tier-d-ink: #DBEAFE;
    --warn-bg: #2A2410; --warn-border: #4A3D15; --warn-ink: #E8C87A;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink-1);
    font: 15px/1.55 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 72px; }

  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .skip {
    position: absolute; left: -9999px; top: 0; background: var(--accent); color: var(--accent-ink);
    padding: 8px 14px; border-radius: 0 0 8px 0; z-index: 100;
  }
  .skip:focus { left: 0; }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-head); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .brand svg { display: block; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 6px 0 24px; }
  .spacer { flex: 1; }
  .badge {
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border-strong);
    color: var(--ink-2); background: var(--surface); font-family: var(--font-head);
  }
  .badge.demo { color: var(--warning); border-color: var(--warning); background: transparent; }
  .badge.live { color: var(--good); border-color: var(--good); background: transparent; }

  button, select {
    font: 500 14px var(--font-body); color: var(--ink-1); background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 14px; cursor: pointer;
    transition: border-color .16s ease-out, background-color .16s ease-out, color .16s ease-out;
    min-height: 38px;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button:disabled:hover { border-color: var(--border-strong); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #1D4ED8; border-color: #1D4ED8; }
  :root[data-theme="dark"] button.primary:hover { background: #60A5FA; border-color: #60A5FA; color: #0F172A; }
  button.ghost { background: transparent; }
  button.icon-btn { padding: 8px 10px; display: inline-flex; align-items: center; gap: 6px; }
  button svg, .icon svg { flex: none; }
  :root[data-theme="dark"] .only-light { display: none; }
  :root:not([data-theme="dark"]) .only-dark { display: none; }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .tile .label { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .tile .value { font-family: var(--font-head); font-size: 32px; font-weight: 650; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .note { font-size: 12px; color: var(--ink-muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---------- Bộ lọc ---------- */
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px;
    padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  }
  .filters label { font-size: 12px; color: var(--ink-2); margin-right: 2px; }
  .chip {
    font-size: 12px; font-weight: 500; padding: 6px 12px; min-height: 32px; border-radius: 999px;
    border: 1px solid var(--border-strong); background: transparent; color: var(--ink-2);
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .filters select { padding: 6px 10px; min-height: 32px; font-size: 13px; border-radius: 8px; }

  /* ---------- Danh sách lead ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; cursor: pointer;
    display: grid; grid-template-columns: 56px 1fr 200px; gap: 16px; align-items: start;
    transition: border-color .16s ease-out;
  }
  .card:hover { border-color: var(--border-strong); }
  .tierbox {
    width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center;
    font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 1;
  }
  .tierbox small { display: block; font-size: 10px; font-weight: 600; opacity: .85; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .t-A { background: var(--tier-a); color: var(--tier-a-ink); }
  .t-B { background: var(--tier-b); color: var(--tier-b-ink); }
  .t-C { background: var(--tier-c); color: var(--tier-c-ink); }
  .t-D { background: var(--tier-d); color: var(--tier-d-ink); }

  .card h3 { margin: 0 0 6px; font-family: var(--font-head); font-size: 15px; font-weight: 600; line-height: 1.35; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); }
  .tag { padding: 2px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); }
  .right { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 150px; }
  .countdown { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-variant-numeric: tabular-nums; }

  .meter { width: 100%; height: 5px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }

  /* ---------- Drawer chi tiết ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.40); display: none; }
  .backdrop.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100%);
    background: var(--surface); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .18s ease-out; overflow-y: auto; padding: 22px;
  }
  .drawer.open { transform: none; }
  .drawer h2 { font-family: var(--font-head); font-size: 17px; margin: 0 0 4px; line-height: 1.35; }
  .bd { margin-top: 6px; }
  .bd-row { display: grid; grid-template-columns: 132px 1fr 38px; gap: 10px; align-items: center; margin-bottom: 7px; font-size: 12px; }
  .bd-row .n { color: var(--ink-2); }
  .bd-row .v { text-align: right; color: var(--ink-1); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bd-bar { height: 5px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bd-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
  .bd-bar.neg { background: var(--track); }
  .bd-bar.neg > i { background: var(--critical); }
  pre.raw {
    white-space: pre-wrap; font: 13px/1.55 var(--font-body); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: var(--ink-2); margin: 0;
  }
  .sec { font-family: var(--font-head); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-muted); margin: 20px 0 8px; font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .warn {
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-ink);
    padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
  }
  .warn.info { background: var(--accent-soft); border-color: var(--accent); color: var(--ink-1); }
  .empty {
    text-align: center; padding: 56px 20px; color: var(--ink-2);
    background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 12px;
  }
  .empty .big { font-family: var(--font-head); font-size: 16px; font-weight: 600; color: var(--ink-1); margin: 12px 0 4px; }
  .empty p { margin: 0 0 16px; font-size: 13px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tbl th, table.tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  table.tbl th { color: var(--ink-muted); font-weight: 600; font-family: var(--font-head); }
  table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .drawer { transition: none; }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    .wrap { padding: 16px 14px 56px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .card { grid-template-columns: 44px 1fr; }
    .tierbox { width: 44px; height: 44px; font-size: 16px; border-radius: 10px; }
    .right { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; text-align: left; min-width: 0; gap: 10px; }
    .countdown { justify-content: flex-start; }
    header .actions-top { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; }
  }
</style>
</head>

// ------------------------------------------------------------------ Trạng thái
const S = {
  mode: 'demo', leads: DEMO.slice(), sb: null, user: null,
  loc: { tier: new Set(), source: '', need: '', freshOnly: true, uncontacted: false },
  tableView: false,
};

// ------------------------------------------------------------------- Tiện ích
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const conHan = (l) => !l.expires_at || new Date(l.expires_at) > new Date();

function conLaiGio(l) {
  if (!l.expires_at) return null;
  return (new Date(l.expires_at) - Date.now()) / 3600e3;
}
/** Trạng thái khẩn: màu LUÔN đi kèm chữ + chấm, không bao giờ chỉ dựa vào màu. */
function mucKhan(l) {
  const h = conLaiGio(l);
  if (h == null) return { mau: 'var(--ink-muted)', chu: 'không rõ hạn' };
  if (h <= 0) return { mau: 'var(--ink-muted)', chu: 'đã hết hạn' };
  if (h <= 2) return { mau: 'var(--critical)', chu: `còn ${Math.max(1, Math.round(h * 60))} phút` };
  if (h <= 6) return { mau: 'var(--warning)', chu: `còn ${h.toFixed(1)} giờ` };
  if (h <= 24) return { mau: 'var(--serious)', chu: `còn ${Math.round(h)} giờ` };
  return { mau: 'var(--good)', chu: `còn ${Math.round(h / 24)} ngày` };
}

function locLeads() {
  return S.leads.filter((l) => {
    if (S.loc.tier.size && !S.loc.tier.has(l.tier)) return false;
    if (S.loc.source && l.source !== S.loc.source) return false;
    if (S.loc.need && !(l.nhu_cau || []).includes(S.loc.need)) return false;
    if (S.loc.freshOnly && !conHan(l)) return false;
    if (S.loc.uncontacted && l.status && l.status !== 'moi') return false;
    return true;
  }).sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
}

/** Trạng thái tải trên nút: disable + đổi chữ, tránh bấm đúp khi đang chờ. */
function nutTai(btn, dangTai, chuTai) {
  if (!btn.dataset.chuGoc) btn.dataset.chuGoc = btn.innerHTML;
  btn.disabled = dangTai;
  btn.innerHTML = dangTai ? esc(chuTai) : btn.dataset.chuGoc;
}

// --------------------------------------------------------------------- Render
function veKpi() {
  const con = S.leads.filter(conHan);
  const sapHet = con.filter((l) => { const h = conLaiGio(l); return h != null && h <= 6; });
  const hangA = con.filter((l) => l.tier === 'A');
  const chuaCham = con.filter((l) => !l.status || l.status === 'moi');
  const tiles = [
    { label: 'Lead còn hạn', value: con.length, note: `${S.leads.length} tổng đã thu thập`, mau: null },
    { label: 'Hạng A', value: hangA.length, note: 'điểm ≥ 75 — ưu tiên chạm', mau: 'var(--accent)' },
    { label: 'Sắp hết hạn', value: sapHet.length, note: 'còn dưới 6 giờ', mau: 'var(--warning)' },
    { label: 'Chưa liên hệ', value: chuaCham.length, note: 'chờ bạn quyết định', mau: 'var(--good)' },
  ];
  $('#kpis').innerHTML = tiles.map((t) => `
    <div class="tile">
      <div class="label">${t.label}</div>
      <div class="value">${t.value}</div>
      <div class="note">${t.mau ? `<span class="dot" style="background:${t.mau}"></span>` : ''}${t.note}</div>
    </div>`).join('');
}

function veThe(l) {
  const k = mucKhan(l);
  const nc = (l.nhu_cau || []).map((n) => `<span class="tag">${NHAN_NHU_CAU[n] || n}</span>`).join('');
  const lh = l.contact_zalo ? `Zalo ${l.contact_zalo}` : l.contact_phone ? l.contact_phone
           : l.contact_email ? l.contact_email : l.contact_url ? 'có link' : '⚠ chưa có liên hệ';
  return `
  <article class="card" data-id="${l.id}">
    <div class="tierbox t-${l.tier}">${l.tier}<small>${l.score}</small></div>
    <div>
      <h3>${esc(l.title)}</h3>
      ${l.source_url ? `<div style="font-size:12px;margin:4px 0"><a href="${esc(l.source_url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">Xem bài gốc ↗</a></div>` : ''}
      <div class="meta">
        <span class="tag">${NHAN_NGUON[l.source] || l.source}</span>
        ${l.khu_vuc && l.khu_vuc !== 'Không rõ' ? `<span class="tag">${esc(l.khu_vuc)}</span>` : ''}
        ${nc}
        ${l.budget_text ? `<span class="tag">${esc(l.budget_text)}</span>` : ''}
      </div>
      <div class="meter" title="Điểm ${l.score}/100" role="img" aria-label="Điểm ${l.score} trên 100"><i style="width:${Math.max(0, Math.min(100, l.score))}%"></i></div>
    </div>
    <div class="right">
      <div class="countdown" style="color:${k.mau}"><span class="dot" style="background:${k.mau}"></span>${k.chu}</div>
      <div style="font-size:12px;color:var(--ink-2)">${esc(lh)}</div>
      ${l.status ? `<span class="badge">${esc(NHAN_TRANG_THAI[l.status] || l.status)}</span>` : ''}
    </div>
  </article>`;
}

function trongRong() {
  const live = S.mode === 'live';
  return `
  <div class="empty">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin:0 auto">
      <path d="M22 12h-6l-2 3h-4l-2-3H2"></path>
      <path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"></path>
    </svg>
    <div class="big">${live ? 'Chưa có lead nào' : 'Không có lead nào khớp bộ lọc'}</div>
    <p>${live ? 'Bảng demand_leads đang trống vì chưa có scraper chạy. Khi có dữ liệu thô trong inbox, bấm “Nạp lead mới” để hệ thống lọc và chấm điểm.' : 'Thử bỏ bớt bộ lọc hạng / nguồn / nhu cầu.'}</p>
  </div>`;
}

function veDanhSach() {
  const ds = locLeads();
  $('#list').innerHTML = ds.length ? ds.map(veThe).join('') : trongRong();
  veBang(ds);
}

/** Bảng dữ liệu — kênh truy cập thay thế, bắt buộc theo yêu cầu accessibility. */
function veBang(ds) {
  $('#tableView').style.display = S.tableView ? 'block' : 'none';
  if (!S.tableView) return;
  $('#tableView').innerHTML = `
    <table class="tbl"><thead><tr>
      <th>Hạng</th><th class="num">Điểm</th><th>Tiêu đề</th><th>Nguồn</th><th>Khu vực</th><th>Còn lại</th><th>Liên hệ</th>
    </tr></thead><tbody>
    ${ds.map((l) => `<tr>
      <td>${l.tier}</td><td class="num">${l.score}</td><td>${esc(l.title)}</td>
      <td>${NHAN_NGUON[l.source] || l.source}</td><td>${esc(l.khu_vuc || '')}</td>
      <td>${mucKhan(l).chu}</td>
      <td>${esc(l.contact_zalo || l.contact_phone || l.contact_email || (l.contact_url ? 'link' : '—'))}</td>
    </tr>`).join('')}
    </tbody></table>`;
}

function moChiTiet(id) {
  const l = S.leads.find((x) => String(x.id) === String(id));
  if (!l) return;
  const bd = l.score_breakdown || {};
  const hang = Object.keys(NHAN_TRUC).filter((k) => k in bd).map((k) => {
    const v = bd[k]; const tran = TRAN_TRUC[k] || 1; const am = v < 0;
    const pct = Math.min(100, Math.abs(v) / tran * 100);
    return `<div class="bd-row">
      <span class="n">${NHAN_TRUC[k]}</span>
      <span class="bd-bar ${am ? 'neg' : ''}"><i style="width:${pct}%"></i></span>
      <span class="v">${v}</span>
    </div>`;
  }).join('');
  const k = mucKhan(l);
  $('#drawer').innerHTML = `
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div class="tierbox t-${l.tier}" style="width:44px;height:44px;font-size:16px;border-radius:10px">${l.tier}<small>${l.score}</small></div>
      <div style="flex:1"><h2>${esc(l.title)}</h2>
        <div class="meta"><span class="tag">${NHAN_NGUON[l.source] || l.source}</span>
        <span style="color:${k.mau}">● ${k.chu}</span></div>
      </div>
      <button class="ghost icon-btn" id="closeDrawer" aria-label="Đóng chi tiết">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="sec">Phân rã điểm (thang 100)</div>
    <div class="bd">${hang || '<span style="font-size:12px;color:var(--ink-muted)">Chưa có phân rã</span>'}</div>

    <div class="sec">Liên hệ</div>
    <div class="meta">
      ${l.contact_zalo ? `<span class="tag">Zalo ${esc(l.contact_zalo)}</span>` : ''}
      ${l.contact_phone ? `<span class="tag">${esc(l.contact_phone)}</span>` : ''}
      ${l.contact_email ? `<span class="tag">${esc(l.contact_email)}</span>` : ''}
      ${l.contact_url ? `<a class="tag" href="${esc(l.contact_url)}" target="_blank" rel="noopener">Mở link</a>` : ''}
      ${!(l.contact_zalo||l.contact_phone||l.contact_email||l.contact_url) ? '<span class="tag">⚠ Chưa có đường liên hệ — cần làm giàu</span>' : ''}
    </div>

    <div class="sec">Nội dung gốc</div>
    <pre class="raw">${esc(l.raw_text)}</pre>
    ${l.source_url ? `<p style="font-size:12px;margin:8px 0 0"><a href="${esc(l.source_url)}" target="_blank" rel="noopener">Xem bài gốc ↗</a></p>` : ''}

    <div class="sec">Bạn quyết định</div>
    <div class="actions">
      <button data-st="quan_tam">Quan tâm</button>
      <button data-st="da_lien_he">Đã liên hệ</button>
      <button data-st="bo">Bỏ qua</button>
    </div>
    <p style="font-size:12px;color:var(--ink-muted);margin-top:14px">
      Máy chỉ đề xuất và xếp hạng. Mọi thay đổi trạng thái đều do bạn bấm, và được ghi vào nhật ký kiểm toán.
    </p>`;
  $('#drawer').classList.add('open');
  $('#backdrop').classList.add('open');
  $('#closeDrawer').onclick = dongChiTiet;
  $('#drawer').querySelectorAll('[data-st]').forEach((b) => {
    b.onclick = () => datTrangThai(l, b.dataset.st);
  });
}
function dongChiTiet() {
  $('#drawer').classList.remove('open');
  $('#backdrop').classList.remove('open');
}

async function datTrangThai(l, st) {
  l.status = st;
  if (S.mode === 'live' && S.sb) {
    const { error } = await S.sb.from('demand_leads').update({ status: st, reviewed_at: new Date().toISOString() }).eq('id', l.id);
    if (error) return baoLoi(`Không cập nhật được: ${error.message}`);
  }
  veKpi(); veDanhSach(); dongChiTiet();
}

function baoLoi(msg, loai = 'warn') {
  const b = $('#warnBox');
  b.hidden = false;
  b.className = loai === 'info' ? 'warn info' : 'warn';
  b.textContent = msg;
}

// ------------------------------------------------------------- Chế độ LIVE
async function ketNoi() {
  const btn = $('#connectBtn');
  nutTai(btn, true, 'Đang kết nối…');
  baoLoi('Đang tải thư viện Supabase…', 'info');
  let createClient;
  try {
    ({ createClient } = await import(CAU_HINH.cdn));
  } catch (e) {
    nutTai(btn, false);
    return baoLoi('Không tải được thư viện Supabase từ CDN (có thể do môi trường xem chặn mạng ngoài). Chế độ Demo vẫn dùng bình thường để review giao diện.');
  }
  S.sb = createClient(CAU_HINH.supabaseUrl, CAU_HINH.supabaseKey);
  const { data: { session } } = await S.sb.auth.getSession();
  if (!session) {
    const { error } = await S.sb.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: location.href } });
    if (error) { nutTai(btn, false); return baoLoi(`Đăng nhập thất bại: ${error.message}`); }
    return; // trình duyệt sẽ chuyển hướng sang GitHub OAuth
  }
  S.user = session.user;
  await taiLead();
  nutTai(btn, false);
}

async function taiLead() {
  $('#subline').textContent = 'Đang tải lead từ Supabase…';
  const { data, error } = await S.sb.from('demand_leads').select('*').order('score', { ascending: false }).limit(500);
  if (error) return baoLoi(`Không đọc được dữ liệu: ${error.message}. Kiểm tra vai trò trong app_users đã được phê duyệt chưa.`);
  S.mode = 'live';
  S.leads = data || [];
  $('#modeBadge').textContent = 'Live';
  $('#modeBadge').className = 'badge live';
  $('#subline').textContent = `Đang nối Supabase — ${S.leads.length} lead. Tài khoản: ${S.user?.email || ''}`;
  $('#warnBox').hidden = true;
  if (S.leads.length === 0) baoLoi('Kết nối thành công nhưng bảng demand_leads đang trống — chưa có scraper nào chạy.', 'info');
  dungBoLoc(); veKpi(); veDanhSach();
}

async function napLeadMoi() {
  if (S.mode !== 'live' || !S.sb) return baoLoi('Cần "Kết nối dữ liệu thật" trước khi nạp lead.');
  const btn = $('#mergeBtn');
  nutTai(btn, true, 'Đang nạp…');
  const { data, error } = await S.sb.rpc('merge_demand_inbox');
  if (error) { nutTai(btn, false); return baoLoi(`Nạp thất bại: ${error.message}`); }
  const r = Array.isArray(data) ? data[0] : data;
  baoLoi(`Nạp xong — thêm mới ${r.them_moi}, bị chặn ${r.bi_chan}, đã có ${r.da_co}, trùng nội dung ${r.trung_noi_dung}, hết hạn ${r.het_han}.`, 'info');
  await taiLead();
  nutTai(btn, false);
}

async function taiInbox() {
  const btn = $('#inboxBtn');
  nutTai(btn, true, 'Đang tải inbox…');
  try {
    // Fetch từ API Worker
    const res = await fetch('/api/demand/inbox?limit=200');
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.loi || `HTTP ${res.status}`);
    }
    const data = await res.json();
    const leads = data.leads || [];
    
    if (leads.length === 0) {
      baoLoi('Inbox trống — chưa có lead nào được quét. Chạy quét nguồn trước.', 'info');
      nutTai(btn, false);
      return;
    }
    
    // Chuyển đổi format để tương thích với dashboard
    S.leads = leads.map(l => ({
      id: l.inbox_id || l.lead_key,
      title: l.title,
      score: l.score,
      tier: l.tier,
      source: l.source,
      nhu_cau: l.nhu_cau || [],
      khu_vuc: l.khu_vuc || 'Không rõ',
      hinh_thuc: l.hinh_thuc || 'unknown',
      posted_at: l.posted_at,
      contact_zalo: l.contact_zalo,
      contact_phone: l.contact_phone,
      contact_email: l.contact_email,
      budget_text: l.budget_text,
      budget_min: l.budget_min,
      budget_max: l.budget_max,
      auto_notes: l.auto_notes,
      source_url: l.source_url,
      raw_text: l.raw_text,
      score_breakdown: l.score_breakdown,
      // Thêm field để phân biệt
      from_inbox: true,
      run_label: l.run_label,
    }));
    
    S.mode = 'inbox';
    $('#modeBadge').textContent = 'Inbox';
    $('#modeBadge').className = 'badge live';
    $('#subline').textContent = `Đang xem ${S.leads.length} leads từ inbox (chưa merge). Tài khoản: ${S.user?.email || 'chưa đăng nhập'}`;
    $('#warnBox').hidden = true;
    dungBoLoc(); veKpi(); veDanhSach();
  } catch (err) {
    baoLoi(`Lỗi tải inbox: ${err.message}`);
  }
  nutTai(btn, false);
}

// ------------------------------------------------------------------- Bộ lọc
function dungBoLoc() {
  const nguon = [...new Set(S.leads.map((l) => l.source))];
  $('#srcSel').innerHTML = '<option value="">Tất cả</option>' +
    nguon.map((s) => `<option value="${s}">${NHAN_NGUON[s] || s}</option>`).join('');
  const needs = [...new Set(S.leads.flatMap((l) => (l.nhu_cau || [])))];
  $('#needSel').innerHTML = '<option value="">Tất cả</option>' +
    needs.map((n) => `<option value="${n}">${NHAN_NHU_CAU[n] || n}</option>`).join('');
}

// ---------------------------------------------------------------- Sự kiện
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip[data-f="tier"]');
  if (chip) {
    const v = chip.dataset.v; const on = chip.getAttribute('aria-pressed') === 'true';
    chip.setAttribute('aria-pressed', String(!on));
    on ? S.loc.tier.delete(v) : S.loc.tier.add(v);
    return veDanhSach();
  }
  const card = e.target.closest('.card');
  if (card) return moChiTiet(card.dataset.id);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#drawer').classList.contains('open')) dongChiTiet();
});
$('#backdrop').onclick = dongChiTiet;
$('#srcSel').onchange = (e) => { S.loc.source = e.target.value; veDanhSach(); };
$('#needSel').onchange = (e) => { S.loc.need = e.target.value; veDanhSach(); };
$('#freshOnly').onclick = (e) => {
  S.loc.freshOnly = !S.loc.freshOnly;
  e.currentTarget.setAttribute('aria-pressed', String(S.loc.freshOnly));
  veKpi(); veDanhSach();
};
$('#uncontacted').onclick = (e) => {
  S.loc.uncontacted = !S.loc.uncontacted;
  e.currentTarget.setAttribute('aria-pressed', String(S.loc.uncontacted));
  veDanhSach();
};
// Tôn trọng hệ thống: lần đầu mở theo prefers-color-scheme, sau đó nút ◐ toàn quyền.
// ?theme=dark|light chỉ phục vụ kiểm tra nhanh / chụp ảnh verify.
const _themeParam = new URLSearchParams(location.search).get('theme');
document.documentElement.dataset.theme =
  (_themeParam === 'dark' || _themeParam === 'light') ? _themeParam
  : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#themeBtn').onclick = () => {
  document.documentElement.dataset.theme =
    document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
};
$('#tableBtn').onclick = () => { S.tableView = !S.tableView; veDanhSach(); };
$('#connectBtn').onclick = ketNoi;
$('#mergeBtn').onclick = napLeadMoi;
$('#inboxBtn').onclick = taiInbox;

// Đồng hồ đếm ngược sống — lead là tài sản có hạn dùng, giao diện phải thể hiện điều đó
setInterval(() => { if (!$('#drawer').classList.contains('open')) { veKpi(); veDanhSach(); } }, 60000);

dungBoLoc(); veKpi(); veDanhSach();
</script>
</body>
