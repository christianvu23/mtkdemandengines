<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawl Dashboard — MTK Demand Engines</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
    }
    h1 { font-size: 24px; color: #f1f5f9; }
    h1 span { color: #22c55e; }
    .btn {
      background: #22c55e;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: #16a34a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: #475569; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #334155;
    }
    .stat-card h3 {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .stat-card .value.green { color: #22c55e; }
    .stat-card .value.blue { color: #3b82f6; }

    .section {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .section h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #f1f5f9;
    }

    .source-list {
      display: grid;
      gap: 10px;
    }
    .source-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .source-item .name { font-weight: 500; }
    .source-item .count {
      display: flex;
      gap: 15px;
      color: #94a3b8;
      font-size: 14px;
    }
    .source-item .count span strong { color: #22c55e; }

    .lead-list { display: grid; gap: 12px; }
    .lead-item {
      background: #0f172a;
      border-radius: 6px;
      padding: 15px;
      border: 1px solid #334155;
    }
    .lead-item h4 {
      color: #3b82f6;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .lead-item h4 a {
      color: inherit;
      text-decoration: none;
    }
    .lead-item h4 a:hover { text-decoration: underline; }
    .lead-item .desc {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .lead-item .meta {
      display: flex;
      gap: 15px;
      font-size: 12px;
      color: #64748b;
    }
    .lead-item .meta .source {
      background: #334155;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    .empty p { margin-bottom: 15px; }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #334155;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      background: #7f1d1d;
      border-color: #991b1b;
      color: #fecaca;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .token-input {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .token-input input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 14px;
    }
    .token-input input::placeholder { color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🕷️ Crawl <span>Dashboard</span></h1>
      <div>
        <button class="btn" id="runBtn" onclick="runCrawl()">
          Chạy Crawl
        </button>
        <button class="btn btn-secondary" onclick="refreshData()" style="margin-left: 10px;">
          Làm mới
        </button>
      </div>
    </header>

    <div class="token-input">
      <input type="password" id="tokenInput" placeholder="Nhập DEMAND_TOKEN để API hoạt động">
      <button class="btn btn-secondary" onclick="saveToken()">Lưu</button>
    </div>

    <div id="errorBox"></div>

    <div class="stats" id="statsBox">
      <div class="stat-card">
        <h3>Tổng items</h3>
        <div class="value blue" id="totalItems">—</div>
      </div>
      <div class="stat-card">
        <h3>Job Leads</h3>
        <div class="value green" id="totalLeads">—</div>
      </div>
      <div class="stat-card">
        <h3>Sources</h3>
        <div class="value" id="totalSources">—</div>
      </div>
      <div class="stat-card">
        <h3>Last Crawl</h3>
        <div class="value" id="lastCrawl" style="font-size: 16px;">—</div>
      </div>
    </div>

    <div class="section">
      <h2>📊 Sources</h2>
      <div class="source-list" id="sourceList">
        <div class="empty"><p>Chưa có dữ liệu. Bấm "Chạy Crawl" để bắt đầu.</p></div>
      </div>
    </div>

    <div class="section">
      <h2>🎯 Job Leads (có signal tuyển dụng)</h2>
      <div class="lead-list" id="leadList">
        <div class="empty"><p>Chưa có leads. Chạy crawl để tìm job opportunities.</p></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('demand_token') || '';

    // Load token on start
    document.getElementById('tokenInput').value = token;

    function saveToken() {
      token = document.getElementById('tokenInput').value;
      localStorage.setItem('demand_token', token);
      alert('Đã lưu token!');
      refreshData();
    }

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'X-Demand-Token': token,
      };
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML = `<div class="error">${msg}</div>`;
    }

    function clearError() {
      document.getElementById('errorBox').innerHTML = '';
    }

    async function refreshData() {
      clearError();

      try {
        // Get status
        const statusRes = await fetch(`${API_BASE}/api/crawl/status`, { headers: getHeaders() });
        const status = await statusRes.json();

        if (!statusRes.ok) {
          showError(status.error || status.loi || 'Lỗi không xác định');
          return;
        }

        document.getElementById('lastCrawl').textContent = status.lastCrawl
          ? new Date(status.lastCrawl).toLocaleString('vi-VN')
          : 'Chưa chạy';

        // Get results if available
        if (status.hasResults) {
          const resRes = await fetch(`${API_BASE}/api/crawl/results`, { headers: getHeaders() });
          const results = await resRes.json();

          if (results.ok) {
            document.getElementById('totalItems').textContent = results.summary.totalItems;
            document.getElementById('totalLeads').textContent = results.summary.totalLeads;
            document.getElementById('totalSources').textContent = results.summary.sources.length;

            // Render sources
            const sourceHtml = results.summary.sources.map(s => `
              <div class="source-item">
                <span class="name">${s.name}</span>
                <span class="count">
                  <span>${s.items} items</span>
                  <span><strong>${s.leads}</strong> leads</span>
                </span>
              </div>
            `).join('');
            document.getElementById('sourceList').innerHTML = sourceHtml || '<div class="empty"><p>Không có sources.</p></div>';
          }
        }

        // Get leads
        const leadsRes = await fetch(`${API_BASE}/api/crawl/leads`, { headers: getHeaders() });
        const leads = await leadsRes.json();

        if (leads.ok && leads.leads.length > 0) {
          const leadHtml = leads.leads.map(l => `
            <div class="lead-item">
              <h4><a href="${l.link || l.url || '#'}" target="_blank">${l.title || 'Untitled'}</a></h4>
              <div class="desc">${(l.description || '').slice(0, 200)}${(l.description || '').length > 200 ? '...' : ''}</div>
              <div class="meta">
                <span class="source">${l.source || 'unknown'}</span>
                <span>${new Date(l.crawledAt).toLocaleDateString('vi-VN')}</span>
              </div>
            </div>
          `).join('');
          document.getElementById('leadList').innerHTML = leadHtml;
        } else {
          document.getElementById('leadList').innerHTML = '<div class="empty"><p>Chưa có leads nào được tìm thấy.</p></div>';
        }

      } catch (err) {
        showError('Lỗi kết nối: ' + err.message);
      }
    }

    async function runCrawl() {
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>Đang chạy...';
      clearError();

      try {
        const res = await fetch(`${API_BASE}/api/crawl/run`, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({}),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || data.loi || 'Lỗi không xác định');
        } else {
          alert(`Crawl hoàn thành!\n\nItems: ${data.summary.totalItems}\nLeads: ${data.summary.totalLeads}\nTime: ${data.duration}`);
          refreshData();
        }
      } catch (err) {
        showError('Lỗi: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Chạy Crawl';
      }
    }

    // Initial load
    refreshData();
  </script>
</body>
</html>
