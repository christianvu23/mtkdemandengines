# Cloudflare Workers — Demand Engine
#
# Worker phục vụ static assets (public/) + API backend (worker.js).
# Assets được phục vụ trước; request không khớp file tĩnh mới rơi vào Worker.

name = "mtkdemandengines"
main = "worker.js"
# 2026-08-08 thay vì 08-09: workerd local của wrangler 4.120.0 chỉ hỗ trợ tới 08-08;
# production workerd mới hơn nên deploy vẫn bình thường. Giữ để `wrangler dev` chạy được.
compatibility_date = "2026-08-08"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cron — CHỈ bật sau khi:
#   1. /api/demand/kiem-tra-transport trả ok cho transport đang dùng
#   2. cau_hinh.regex_link_bai đã điền cho từng nguồn (cần xem HTML thật)
# [triggers]
# crons = ["*/30 * * * *"]

# Queue — quét KHÔNG đồng bộ: /api/demand/quet và cron chỉ xếp job vào đây,
# consumer (handler `queue` trong worker.js) xử lý từng nguồn, từng link.
# Cần bật Cloudflare Queues (GA, có trên Workers Paid). Tạo queue cùng tên:
#   npx wrangler queues create demand-queue
[[queues.producers]]
binding = "QUEUE_QUET"
queue = "demand-queue"

[[queues.consumers]]
queue = "demand-queue"
max_batch_size = 20
max_retries = 3

# Secret (nạp bằng `npx wrangler secret put <TEN>`, KHÔNG commit):
#   SUPABASE_URL              https://emkwknwcyyewevmmoxzj.supabase.co
#   SUPABASE_SERVICE_KEY      service_role key — bỏ qua RLS, chỉ để ở đây
#   DEMAND_TOKEN              khoá tự đặt, bảo vệ cổng nạp
#   CLOUDFLARE_ACCOUNT_ID     cho transport browser_run
#   CLOUDFLARE_API_TOKEN      cho transport browser_run
#   BRIGHTDATA_API_KEY        cho transport unlocker
#   BRIGHTDATA_UNLOCKER_ZONE  cho transport unlocker
